name: test

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "ci/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [documents, spreadsheet, presentation, pdf, pm]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test apps/${{ matrix.app }}
        run: npm test -w apps/${{ matrix.app }}

  office-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fusion-core
        run: pip install "git+https://github.com/dahai80/fusion-core.git"
      - name: Install office-api with test extras
        run: pip install -e "services/office-api[test]"
      - name: Test services/office-api
        run: python -m pytest tests -q
        working-directory: services/office-api

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pkg: [storage, ai-client]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test packages/${{ matrix.pkg }}
        run: npm test -w packages/${{ matrix.pkg }}
